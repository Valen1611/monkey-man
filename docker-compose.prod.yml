services:
  frontend:
    build:
      context: .
      args:
        APP_NAME: frontend
        PORT: 7071
    env_file:
      - ./.env
    ports:
      - "7071:7071"
    environment:
      - PORT=7071
      # NEXT_PUBLIC_API_URL and NEXT_PUBLIC_API_SECRET are intentionally NOT overridden here
      # so they are read from .env — change them there.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7071/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always

  backend:
    build:
      context: .
      args:
        APP_NAME: backend
        PORT: 7070
    env_file:
      - ./.env
    volumes:
      - ./secrets:/app/secrets:ro
      - ./custom-parsers:/app/apps/backend/worker/sources/custom
    ports:
      - "7070:7070"
    environment:
      - PORT=7070
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/gcp-key.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7070/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always

  listener:
    build:
      context: .
      args:
        APP_NAME: backend
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ./.env
    volumes:
      - ./secrets:/app/secrets:ro
      - ./custom-parsers:/app/apps/backend/worker/sources/custom
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/gcp-key.json
    restart: always
